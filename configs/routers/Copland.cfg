version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Copland
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description A14 - Switch2
 ip address 10.69.16.131 255.255.255.248
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description A3 - Switch4
 ip address 10.69.8.1 255.255.254.0
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description A9 - Juri
 ip address 10.69.14.129 255.255.255.192
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 0.0.0.0 0.0.0.0 10.69.16.129 
!
ip flow-export version 9
!
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
