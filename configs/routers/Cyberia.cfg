version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Cyberia
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description Cloud uplink - external addressing not specified
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description A7 - Switch1
 ip address 10.69.14.1 255.255.255.128
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description A17 - Wired
 ip address 10.69.16.153 255.255.255.252
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 10.69.0.0 255.255.224.0 10.69.16.154 
!
ip flow-export version 9
!
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
