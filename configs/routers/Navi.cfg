version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname Navi
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description A18 - Wired
 ip address 10.69.16.158 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description A5 - Switch6
 ip address 10.69.12.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description A10 - Switch7
 ip address 10.69.15.193 255.255.255.192
 duplex auto
 speed auto
!
interface FastEthernet1/1
 description A6 - Switch8
 ip address 10.69.13.1 255.255.255.0
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
 shutdown
!
ip classless
ip route 0.0.0.0 0.0.0.0 10.69.16.157 
!
ip flow-export version 9
!
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
